# Blueprint สำหรับ Render — ใช้สร้างทั้งเว็บและฐานข้อมูลพร้อมกันในคลิกเดียว
# วิธีใช้: Render Dashboard -> New + -> Blueprint -> เลือก repo นี้
# (ถ้าอยากสร้างทีละอันเองก็ได้ ดูขั้นตอนใน docs/deployment.md)
services:
  - type: web
    name: shopmarket
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      # Render สุ่มค่าให้เองตอนสร้างครั้งแรก ไม่ต้องกรอกเอง
      - key: SECRET_KEY
        generateValue: true
      # ดึง connection string จากฐานข้อมูลด้านล่างมาให้อัตโนมัติ
      - key: DATABASE_URL
        fromDatabase:
          name: shopmarket-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
    # หมายเหตุ: disk ต้องใช้แพ็กเกจแบบเสียเงิน ถ้าใช้ free plan ให้ลบ 4 บรรทัดนี้ออก
    # แล้วยอมรับว่าไฟล์ที่อัปโหลดจะหายทุกครั้งที่ deploy ใหม่ (ดูทางเลือกใน docs/deployment.md)
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 1

databases:
  - name: shopmarket-db
    plan: free
