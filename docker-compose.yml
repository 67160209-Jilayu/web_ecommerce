services:
  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app # แก้โค้ดฝั่งเครื่อง เห็นผลทันทีไม่ต้อง build ใหม่
      - ./frontend:/app/frontend # FastAPI serve ไฟล์ frontend จากโฟลเดอร์นี้
    env_file: .env
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: appdb
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db_data:
