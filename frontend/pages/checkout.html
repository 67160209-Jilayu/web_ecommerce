<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ยืนยันคำสั่งซื้อ - ShopMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Taviraj:wght@400;500;600;700&family=Chakra+Petch:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/style.css?v=20261016a" />
</head>
<body>
  <a href="#main" class="skip-link">ข้ามไปเนื้อหาหลัก</a>
  <header class="topbar">
    <a href="../index.html" class="logo">🛒 ShopMarket</a>
    <div style="flex: 1"></div>
    <span id="auth-status" data-base="../"></span>
    <a href="cart.html" class="cart-link" aria-label="ตะกร้าสินค้า">
      <span aria-hidden="true">🛍️</span>
      <span class="icon-label">ตะกร้า</span>
      <span class="cart-badge" id="cart-badge">0</span>
    </a>
  </header>

  <main class="container" id="main" tabindex="-1">
    <a href="cart.html" class="back-link">← กลับไปตะกร้าสินค้า</a>
    <p class="page-title">ยืนยันคำสั่งซื้อ</p>
    <div id="checkout-body"><p class="state-message">กำลังโหลด...</p></div>
  </main>

  <script src="../js/api.js?v=20261016a"></script>
  <script>
    const PAY_OPTIONS = [
      { value: "COD", icon: "💵", label: "เก็บเงินปลายทาง", desc: "จ่ายเงินสดกับพนักงานส่งของตอนรับสินค้า" },
      { value: "BANK_TRANSFER", icon: "🏦", label: "โอนผ่านธนาคาร", desc: "โอนแล้วกดยืนยันการชำระเงินในหน้าคำสั่งซื้อ" },
      { value: "CARD", icon: "💳", label: "บัตรเครดิต/เดบิต", desc: "ตัดบัตรทันที (โหมดทดสอบ ไม่มีการเรียกเก็บเงินจริง)" },
    ];

    // ค่าเริ่มต้นของร้าน ใช้ประมาณการเฉพาะตอนดึงค่าส่งจริงจาก backend ไม่ได้
    const SHIPPING_FEE = 40;
    const FREE_SHIPPING_MIN = 500;

    let cartData = null;
    let provinces = [];
    let province = "";
    let quote = null; // {shops:[{shop_id, fee, days_min, days_max}]} จาก /cart/{token}/shipping-quote

    async function loadCheckout() {
      const body = document.getElementById("checkout-body");

      if (!isLoggedIn()) {
        requireLogin("../");
        return;
      }

      try {
        cartData = await fetchCart();
      } catch (err) {
        body.innerHTML = `<p class="state-message">เกิดข้อผิดพลาด: ${escapeHtml(err.message)}</p>`;
        return;
      }

      if (!cartData.items.length) {
        body.innerHTML = `<p class="state-message">ตะกร้าว่าง —
          <a href="../index.html" style="color: var(--azure);">ไปเลือกซื้อสินค้าก่อน</a></p>`;
        return;
      }

      const [user, provList, savedProvince] = await Promise.all([
        fetchMe(),
        fetchProvinces().catch(() => []),
        getBuyerProvince(),
      ]);
      provinces = provList || [];
      province = savedProvince;
      await loadQuote();

      body.innerHTML = `
        <div class="checkout-layout">
          <div>
            <div class="panel">
              <h2 class="panel-title" style="margin-bottom:16px;">ที่อยู่จัดส่ง</h2>
              <p class="alert alert-error" id="checkout-error" style="display:none;"></p>
              <form id="checkout-form" novalidate>
                <div class="form-grid">
                  <div class="form-group">
                    <label for="recipient-name">ชื่อผู้รับ *</label>
                    <input type="text" id="recipient-name" required autocomplete="name" value="${escapeHtml(user?.name || "")}" />
                  </div>
                  <div class="form-group">
                    <label for="recipient-phone">เบอร์โทรศัพท์ *</label>
                    <input type="tel" id="recipient-phone" required inputmode="numeric" autocomplete="tel"
                      placeholder="เช่น 0812345678" aria-describedby="phone-hint" />
                    <div class="form-hint" id="phone-hint">ร้านจะโทรหาเบอร์นี้เมื่อจัดส่ง</div>
                  </div>
                </div>
                <div class="form-group">
                  <label for="address">ที่อยู่จัดส่ง *</label>
                  <textarea id="address" rows="3" required autocomplete="street-address"
                    placeholder="บ้านเลขที่ ถนน แขวง/ตำบล เขต/อำเภอ รหัสไปรษณีย์"></textarea>
                </div>
                <div class="form-group">
                  <label for="province">จังหวัด *</label>
                  <select id="province" ${provinces.length ? "required" : "disabled"}>
                    <option value="">— เลือกจังหวัด —</option>
                    ${provinceOptionsHtml(provinces, province)}
                  </select>
                  <div class="form-hint">ใช้คำนวณค่าส่งและระยะเวลาจัดส่งของแต่ละร้าน</div>
                </div>
                <div class="form-group">
                  <label for="note">หมายเหตุถึงร้านค้า (ไม่บังคับ)</label>
                  <textarea id="note" rows="2" placeholder="เช่น ฝากไว้ที่นิติบุคคล"></textarea>
                </div>
              </form>
            </div>

            <div class="panel">
              <h2 class="panel-title" style="margin-bottom:16px;">วิธีชำระเงิน</h2>
              ${PAY_OPTIONS.map(
                (opt, i) => `
                <label class="pay-option ${i === 0 ? "selected" : ""}" data-value="${opt.value}">
                  <input type="radio" name="payment" value="${opt.value}" ${i === 0 ? "checked" : ""} />
                  <span class="pay-option-icon">${opt.icon}</span>
                  <span>
                    <div>${opt.label}</div>
                    <div class="pay-option-desc">${opt.desc}</div>
                  </span>
                </label>`
              ).join("")}
            </div>

            <div class="panel">
              <h2 class="panel-title" style="margin-bottom:16px;">สรุปรายการ (แยกตามร้าน)</h2>
              <div id="shop-groups">${renderShopGroups()}</div>
            </div>
          </div>

          <div class="summary-panel">
            <h2 style="font-family: var(--font-display); margin: 0 0 14px; font-size: 1.15rem;">ยอดที่ต้องชำระ</h2>
            <div id="summary-rows">${renderSummaryRows()}</div>
            <button class="btn btn-primary" id="place-order-btn" style="width: 100%; margin-top: 16px;">
              ยืนยันคำสั่งซื้อ
            </button>
            <p style="font-size: var(--fs-sm); margin: 10px 0 0; text-align: center;" id="ship-note">
              ${shipNote()}
            </p>
          </div>
        </div>`;

      // ไฮไลต์ตัวเลือกที่เลือกอยู่
      document.querySelectorAll(".pay-option").forEach((el) => {
        el.addEventListener("click", () => {
          document.querySelectorAll(".pay-option").forEach((o) => o.classList.remove("selected"));
          el.classList.add("selected");
        });
      });

      document.getElementById("place-order-btn").addEventListener("click", placeOrder);
      document.getElementById("province").addEventListener("change", async (e) => {
        province = e.target.value;
        setBuyerProvince(province);
        await loadQuote();
        document.getElementById("shop-groups").innerHTML = renderShopGroups();
        document.getElementById("summary-rows").innerHTML = renderSummaryRows();
        document.getElementById("ship-note").innerHTML = shipNote();
      });
    }

    async function loadQuote() {
      try {
        quote = await fetchShippingQuote(province);
      } catch {
        quote = null; // ยังไม่มี endpoint / เรียกไม่สำเร็จ → ใช้ค่าประมาณ
      }
    }

    function shipNote() {
      if (!quote) return "ค่าส่งเป็นค่าประมาณ (฿40/ร้าน · ครบ ฿500 ต่อร้านส่งฟรี) ยอดจริงคำนวณตอนยืนยัน";
      return province ? `ค่าส่งตามอัตราของแต่ละร้านไป${escapeHtml(province)}` : "เลือกจังหวัดเพื่อดูค่าส่งจริงของแต่ละร้าน";
    }

    /** จัดกลุ่มรายการในตะกร้าตามร้าน + คำนวณค่าส่งแบบเดียวกับ backend เพื่อให้ตัวเลขตรงกัน */
    function groupByShop() {
      const groups = {};
      cartData.items.forEach((item) => {
        const key = item.shop_id || 0;
        groups[key] = groups[key] || { name: item.shop_name || "ไม่ระบุร้าน", items: [] };
        groups[key].items.push(item);
      });
      return Object.entries(groups).map(([shopId, g]) => {
        const subtotal = g.items.reduce((s, i) => s + i.price * i.quantity, 0);
        const q = (quote?.shops || []).find((x) => String(x.shop_id) === String(shopId));
        if (q) return { ...g, subtotal, shipping: Number(q.fee) || 0, days_min: q.days_min, days_max: q.days_max };
        const allFree = g.items.every((i) => i.free_shipping);
        const shipping = allFree || subtotal >= FREE_SHIPPING_MIN ? 0 : SHIPPING_FEE;
        return { ...g, subtotal, shipping };
      });
    }

    function renderShopGroups() {
      return groupByShop()
        .map(
          (g) => `
        <div class="shop-group">
          <div class="shop-group-head">🏪 ${escapeHtml(g.name)}</div>
          ${g.items
            .map(
              (i) => `
            <div class="order-line">
              <div class="order-line-thumb">${productThumb(i)}</div>
              <div class="order-line-info">
                <div class="order-line-name">${escapeHtml(i.name)}</div>
                <div class="order-line-meta">${formatBaht(i.price)} × ${i.quantity}</div>
              </div>
              <div class="cart-item-price">${formatBaht(i.price * i.quantity)}</div>
            </div>`
            )
            .join("")}
          <div class="order-line-meta" style="padding-top: 10px; text-align: right;">
            ค่าจัดส่ง: ${g.shipping === 0 ? "<b style='color:var(--azure)'>ฟรี</b>" : formatBaht(g.shipping)}
            ${g.days_min ? ` · ถึงใน ${g.days_min}${g.days_max && g.days_max !== g.days_min ? `–${g.days_max}` : ""} วัน` : ""}
          </div>
        </div>`
        )
        .join("");
    }

    function renderSummaryRows() {
      const groups = groupByShop();
      const subtotal = groups.reduce((s, g) => s + g.subtotal, 0);
      const shipping = groups.reduce((s, g) => s + g.shipping, 0);
      const count = cartData.items.reduce((s, i) => s + i.quantity, 0);
      return `
        <div class="summary-row"><span>สินค้า (${count} ชิ้น)</span><span>${formatBaht(subtotal)}</span></div>
        <div class="summary-row"><span>ค่าจัดส่ง (${groups.length} ร้าน)</span><span>${formatBaht(shipping)}</span></div>
        <div class="summary-row grand"><span>รวมทั้งสิ้น</span><span>${formatBaht(subtotal + shipping)}</span></div>`;
    }

    async function placeOrder(e) {
      const btn = e.currentTarget;
      const errorEl = document.getElementById("checkout-error");
      errorEl.style.display = "none";

      const payload = {
        recipient_name: document.getElementById("recipient-name").value.trim(),
        recipient_phone: document.getElementById("recipient-phone").value.trim(),
        address: document.getElementById("address").value.trim(),
        note: document.getElementById("note").value.trim(),
        payment_method: document.querySelector('input[name="payment"]:checked').value,
        province: document.getElementById("province").value || null,
      };

      // ตรวจทีละช่อง: ขึ้นข้อความสีแดงใต้ช่องที่ต้องแก้ แล้วเลื่อนไปช่องแรกที่ผิด (ข้อมูลที่กรอกไว้ไม่หาย)
      const form = document.getElementById("checkout-form");
      const phone = document.getElementById("recipient-phone");
      // ตรวจทุกช่องในครั้งเดียว (รวมรูปแบบเบอร์โทร) แล้วพาไปช่องแรกที่ต้องแก้
      const ok = validateRequired(form);
      if (!ok) {
        if (!payload.recipient_phone) setFieldError(phone, "กรุณากรอกเบอร์โทร เช่น 0812345678");
        return;
      }

      btn.disabled = true;
      btn.textContent = "กำลังสร้างคำสั่งซื้อ...";
      try {
        const orders = await checkout(payload);
        await renderCartBadge();
        showToast(`สั่งซื้อสำเร็จ ${orders.length} คำสั่งซื้อ`);
        setTimeout(() => (window.location.href = "orders.html"), 800);
      } catch (err) {
        errorEl.textContent = `สั่งซื้อไม่สำเร็จ: ${err.message}`;
        errorEl.style.display = "block";
        errorEl.setAttribute("role", "alert");
        errorEl.scrollIntoView({ block: "center" });
        btn.disabled = false;
        btn.textContent = "ยืนยันคำสั่งซื้อ";
      }
    }

    loadCheckout();
  </script>
</body>
</html>
