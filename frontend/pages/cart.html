<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ตะกร้าสินค้า - ShopMarket</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <a href="../index.html" class="logo">🛒 ShopMarket</a>
    <form class="search-bar" id="search-form">
      <input type="text" id="search-input" placeholder="ค้นหาสินค้า..." autocomplete="off" />
      <button type="submit">ค้นหา</button>
    </form>
    <a href="cart.html" class="cart-link">
      🛍️
      <span class="cart-badge" id="cart-badge">0</span>
    </a>
  </header>

  <main class="container">
    <p class="page-title">ตะกร้าสินค้าของฉัน</p>
    <div id="cart-list"><p class="state-message">กำลังโหลดตะกร้า...</p></div>
    <div id="cart-summary-wrap"></div>
  </main>

  <script src="../js/api.js"></script>
  <script>
    const searchForm = document.getElementById("search-form");
    searchForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const q = document.getElementById("search-input").value.trim();
      window.location.href = q
        ? `../index.html?search=${encodeURIComponent(q)}`
        : "../index.html";
    });

    async function renderCart() {
      const listEl = document.getElementById("cart-list");
      const summaryEl = document.getElementById("cart-summary-wrap");

      let cart;
      try {
        cart = await fetchCart();
      } catch (err) {
        listEl.innerHTML = `<p class="state-message">เกิดข้อผิดพลาด: ${err.message}</p>`;
        return;
      }

      if (cart.items.length === 0) {
        listEl.innerHTML = `<p class="state-message">ตะกร้าของคุณยังว่างอยู่ — <a href="../index.html" style="color:#ee4d2d;">ไปเลือกซื้อสินค้ากันเถอะ</a></p>`;
        summaryEl.innerHTML = "";
        return;
      }

      listEl.innerHTML = cart.items
        .map(
          (item) => `
        <div class="cart-item">
          <div class="cart-item-thumb">${item.image}</div>
          <div class="cart-item-info">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-price">${formatBaht(item.price)}</div>
          </div>
          <div class="cart-item-qty">
            <button type="button" onclick="changeQty(${item.product_id}, ${item.quantity - 1})">−</button>
            <span>${item.quantity}</span>
            <button type="button" onclick="changeQty(${item.product_id}, ${item.quantity + 1})" ${item.quantity >= item.stock ? "disabled" : ""}>+</button>
          </div>
          <div class="cart-item-price">${formatBaht(item.price * item.quantity)}</div>
          <button class="cart-item-remove" onclick="removeItem(${item.product_id})">ลบ</button>
        </div>
      `
        )
        .join("");

      const itemCount = cart.items.reduce((sum, i) => sum + i.quantity, 0);
      summaryEl.innerHTML = `
        <div class="cart-summary">
          <div>รวมทั้งหมด (${itemCount} ชิ้น)</div>
          <div class="cart-total">${formatBaht(cart.total)}</div>
        </div>
        <div style="text-align:right; margin-top:14px;">
          <button class="btn btn-primary" onclick="goCheckout()">ดำเนินการชำระเงิน</button>
        </div>
      `;
    }

    async function changeQty(productId, newQty) {
      try {
        if (newQty < 1) {
          await removeCartItem(productId);
        } else {
          await updateCartItemQty(productId, newQty);
        }
        await renderCartBadge();
        await renderCart();
      } catch (err) {
        alert("เกิดข้อผิดพลาด: " + err.message);
      }
    }

    async function removeItem(productId) {
      await changeQty(productId, 0);
    }

    function goCheckout() {
      // ระบบชำระเงินจะเชื่อมต่อจริงในสัปดาห์ถัดไป (ต้องมีระบบล็อกอินก่อน)
      alert("ระบบชำระเงินจะเปิดให้ใช้งานในสัปดาห์ถัดไป เมื่อมีระบบล็อกอินแล้ว");
    }

    renderCart();
  </script>
</body>
</html>
