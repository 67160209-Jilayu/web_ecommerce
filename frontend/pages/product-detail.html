<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>รายละเอียดสินค้า - ShopMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Taviraj:wght@400;500;600;700&family=Chakra+Petch:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/style.css?v=20261009e" />
</head>
<body>
  <a href="#main" class="skip-link">ข้ามไปเนื้อหาหลัก</a>
  <header class="topbar">
    <a href="../index.html" class="logo">🛒 ShopMarket</a>
    <form class="search-bar" id="search-form">
      <input type="search" id="search-input" aria-label="ค้นหาสินค้า" placeholder="ค้นหาสินค้า..." autocomplete="off" />
      <button type="submit">ค้นหา</button>
    </form>
    <span id="auth-status" data-base="../"></span>
    <a href="cart.html" class="cart-link" aria-label="ตะกร้าสินค้า">
      <span aria-hidden="true">🛍️</span>
      <span class="icon-label">ตะกร้า</span>
      <span class="cart-badge" id="cart-badge">0</span>
    </a>
  </header>

  <main class="container" id="main" tabindex="-1">
    <a href="../index.html" class="back-link">← กลับไปหน้ารายการสินค้า</a>
    <div id="detail-content">
      <p class="state-message loading">กำลังโหลดข้อมูลสินค้า...</p>
    </div>
    <div id="specs-content"></div>
    <div id="same-model-content"></div>
    <div id="review-content"></div>
  </main>

  <script src="../js/api.js?v=20261009e"></script>
  <script src="../js/chat.js?v=20261009e"></script>
  <script>
    document.getElementById("search-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const q = document.getElementById("search-input").value.trim();
      window.location.href = q ? `../index.html?search=${encodeURIComponent(q)}` : "../index.html";
    });

    let currentProduct = null;
    let mediaList = [];

    function getProductIdFromUrl() {
      return parseInt(new URLSearchParams(window.location.search).get("id"), 10);
    }

    /** แสดงสื่อชิ้นที่เลือกในกรอบใหญ่ (รูปหรือวิดีโอ) */
    function selectMedia(index) {
      const main = document.getElementById("gallery-main");
      const item = mediaList[index];
      if (!item) return;

      main.innerHTML =
        item.media_type === "video"
          ? `<video src="${escapeHtml(item.url)}" controls playsinline></video>`
          : `<img src="${escapeHtml(item.url)}" alt="${escapeHtml(currentProduct.name)}" />`;

      document.querySelectorAll(".gallery-thumb").forEach((el, i) => {
        el.classList.toggle("active", i === index);
      });
    }

    function galleryHtml(product) {
      if (!mediaList.length) {
        // ยังไม่อัปโหลดสื่อ ใช้ emoji ตัวใหญ่แทน
        return `<div class="gallery-main">${product.image || "📦"}</div>`;
      }
      const thumbs = mediaList
        .map(
          (m, i) => `
          <button type="button" class="gallery-thumb ${i === 0 ? "active" : ""}" onclick="selectMedia(${i})">
            ${
              m.media_type === "video"
                ? `<video src="${escapeHtml(m.url)}" muted></video><span class="video-mark">▶</span>`
                : `<img src="${escapeHtml(m.url)}" alt="" />`
            }
          </button>`
        )
        .join("");
      return `
        <div>
          <div class="gallery-main" id="gallery-main"></div>
          ${mediaList.length > 1 ? `<div class="gallery-thumbs">${thumbs}</div>` : ""}
        </div>`;
    }

    async function loadDetail() {
      const container = document.getElementById("detail-content");
      const id = getProductIdFromUrl();

      if (!id) {
        container.innerHTML = `<p class="state-message">ไม่พบสินค้าที่ต้องการ (ไม่มี id ใน URL)</p>`;
        return;
      }

      let product;
      try {
        product = await fetchProduct(id);
      } catch (err) {
        container.innerHTML = `<p class="state-message">เกิดข้อผิดพลาด: ${escapeHtml(err.message)}</p>`;
        return;
      }
      if (!product) {
        container.innerHTML = `<p class="state-message">ไม่พบสินค้านี้ อาจถูกลบหรือปิดขายไปแล้ว</p>`;
        return;
      }

      currentProduct = product;
      mediaList = product.media || [];

      const outOfStock = product.stock === 0;
      const lowStock = product.stock > 0 && product.stock <= 5;

      container.innerHTML = `
        <div class="detail-layout">
          ${galleryHtml(product)}
          <div>
            <h1 class="detail-name">${escapeHtml(product.name)}</h1>
            <div class="detail-shop">
              ร้านค้า: <a href="shop.html?id=${product.shop_id}" style="color: var(--azure); font-weight: 600;">${escapeHtml(product.shop_name)}</a>
              · ${product.review_count > 0 ? `⭐ ${product.rating} (${product.review_count} รีวิว)` : "ยังไม่มีรีวิว"}
              · ขายแล้ว ${product.sold.toLocaleString("th-TH")} ชิ้น
            </div>
            <span class="pill-muted">${escapeHtml(product.category)}</span>
            ${product.free_shipping ? `<span class="badge-free-shipping" style="margin-left:8px">จัดส่งฟรี</span>` : ""}
            ${product.spec_complete ? `<span style="margin-left:8px">${specCompleteBadge(product)}</span>` : ""}

            <div class="detail-price-box">
              <div class="detail-price">
                ${priceHtml(product)}
              </div>
            </div>

            <p class="detail-desc">${escapeHtml(product.description) || "ผู้ขายยังไม่ได้ใส่รายละเอียดสินค้า"}</p>

            ${
              outOfStock
                ? `<p class="stock-warning">สินค้าหมดชั่วคราว ไม่สามารถสั่งซื้อได้ในขณะนี้</p>
                   <button class="btn btn-secondary" disabled>สินค้าหมด</button>`
                : `
                  <div class="qty-selector">
                    <button type="button" id="qty-minus" aria-label="ลดจำนวน">−</button>
                    <input type="number" id="qty-input" value="1" min="1" max="${product.stock}" aria-label="จำนวนที่ต้องการซื้อ" inputmode="numeric" />
                    <button type="button" id="qty-plus" aria-label="เพิ่มจำนวน">+</button>
                    <span style="color: var(--muted); font-size: var(--fs-sm);">คงเหลือ ${product.stock} ชิ้น</span>
                  </div>
                  ${lowStock ? `<p class="stock-warning">เหลือสินค้าจำนวนน้อย รีบสั่งซื้อก่อนหมด</p>` : ""}
                  <button class="btn btn-primary" id="add-to-cart-btn">เพิ่มลงตะกร้า</button>`
            }
            <div class="detail-compare-actions">
              ${compareButtonHtml(product, "compare-btn-lg")}
              <button type="button" class="btn-ghost" id="compare-similar-btn">เทียบกับสินค้าคล้ายกัน</button>
              <button type="button" class="btn-ghost chat-entry-btn" data-chat-entry ${ShopChat.isReady() ? "" : "hidden"}
                onclick="ShopChat.open()">💬 ถามเกี่ยวกับสินค้านี้</button>
            </div>
          </div>
        </div>`;

      if (mediaList.length) selectMedia(0);
      renderBuyBar(product, outOfStock);

      if (!outOfStock) {
        const qtyInput = document.getElementById("qty-input");
        document.getElementById("qty-minus").addEventListener("click", () => {
          qtyInput.value = Math.max(1, parseInt(qtyInput.value || "1", 10) - 1);
        });
        document.getElementById("qty-plus").addEventListener("click", () => {
          qtyInput.value = Math.min(product.stock, parseInt(qtyInput.value || "1", 10) + 1);
        });
        document.getElementById("add-to-cart-btn").addEventListener("click", async (e) => {
          const btn = e.currentTarget;
          const qty = Math.max(1, Math.min(product.stock, parseInt(qtyInput.value || "1", 10)));
          btn.disabled = true;
          try {
            await addToCart(product.id, qty);
            await renderCartBadge();
            showAddedToCart();
          } catch (err) {
            showToast(err.message, "error");
          } finally {
            btn.disabled = false;
          }
        });
      }

      document.getElementById("compare-similar-btn").addEventListener("click", compareSimilar);
      renderSpecs(product);
      loadSameModel(product);
      loadReviews(id, product);
    }

    /** มือถือ: รูปใหญ่ดันราคาและปุ่มซื้อตกจอ → มีแถบติดล่างจอให้กดซื้อได้ทันที */
    function renderBuyBar(product, outOfStock) {
      document.getElementById("buy-bar")?.remove();
      const bar = document.createElement("div");
      bar.id = "buy-bar";
      bar.className = "buy-bar";
      bar.innerHTML = `
        <div class="buy-bar-price">${formatBaht(product.price)}</div>
        ${outOfStock
          ? `<button type="button" class="btn btn-secondary" disabled>สินค้าหมด</button>`
          : `<button type="button" class="btn btn-primary" id="buy-bar-btn">เพิ่มลงตะกร้า</button>`}`;
      document.body.appendChild(bar);
      document.body.classList.add("has-buy-bar");
      document.getElementById("buy-bar-btn")?.addEventListener("click", () =>
        document.getElementById("add-to-cart-btn")?.click()
      );
    }

    /** "เทียบกับสินค้าคล้ายกัน": เอาสินค้านี้ + สินค้าหมวดเดียวกันที่ใกล้เคียงไปเปิดหน้าเทียบเลย */
    async function compareSimilar(e) {
      const btn = e.currentTarget;
      btn.disabled = true;
      try {
        const similar = ((await fetchSimilar(currentProduct.id, 3)) || [])
          .filter((p) => p.id !== currentProduct.id)
          .slice(0, COMPARE_MAX - 1);
        if (!similar.length) {
          showToast("ยังไม่มีสินค้าคล้ายกันในหมวดนี้ให้เทียบ", "error");
          return;
        }
        window.location.href = compareUrl([currentProduct.id, ...similar.map((p) => p.id)]);
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        btn.disabled = false;
      }
    }

    /** สเปกสินค้าจัดกลุ่มตามแม่แบบหมวด (แสดงเฉพาะที่ผู้ขายกรอก) */
    function renderSpecs(product) {
      const attrs = (product.attributes || []).filter(
        (a) => a.display !== null && a.display !== undefined && a.display !== ""
      );
      const box = document.getElementById("specs-content");
      const brandLine = [product.brand, product.model_code].filter(Boolean).map(escapeHtml).join(" · ");
      if (!attrs.length && !brandLine) {
        box.innerHTML = "";
        return;
      }
      const groups = {};
      attrs.forEach((a) => (groups[a.group_name || "ทั่วไป"] = groups[a.group_name || "ทั่วไป"] || []).push(a));
      box.innerHTML = `
        <div class="review-section">
          <h2 class="panel-title" style="margin-bottom: 10px;">สเปกสินค้า</h2>
          ${brandLine ? `<p class="spec-brand">แบรนด์/รุ่น: ${brandLine}</p>` : ""}
          ${Object.entries(groups)
            .map(
              ([g, list]) => `
            <div class="spec-group">
              <div class="spec-group-title">${escapeHtml(g)}</div>
              <dl class="spec-list">
                ${list
                  .map(
                    (a) => `<dt>${escapeHtml(a.name_th || a.key)}</dt>
                            <dd>${escapeHtml(String(a.display))}</dd>`
                  )
                  .join("")}
              </dl>
            </div>`
            )
            .join("")}
        </div>`;
    }

    /** "ร้านอื่นที่ขายรุ่นนี้" — จับคู่จากบาร์โค้ด หรือแบรนด์+รหัสรุ่นตรงกัน; ไม่มีก็ไม่แสดงส่วนนี้ */
    async function loadSameModel(product) {
      const box = document.getElementById("same-model-content");
      const province = await getBuyerProvince();
      let list = [];
      try {
        const res = await fetchSameModel(product.id, province);
        list = Array.isArray(res) ? res : res?.items || [];
      } catch {
        return;
      }
      if (!list.length) {
        box.innerHTML = "";
        return;
      }
      // ราคารวมค่าส่งของร้านนี้ (จาก /compare ชิ้นเดียว ใช้ engine เดียวกัน) เป็นแถวแรกไว้เทียบ
      let self = null;
      try {
        const params = province ? { province } : {};
        const c = await fetchCompare([product.id], params);
        const it = (c.items || [])[0];
        if (it) self = { shipping_fee: it.shipping?.fee, days_min: it.shipping?.days_min, days_max: it.shipping?.days_max, total: it.total, shipping: it.shipping };
      } catch {}
      const diffLabel = (o) => {
        if (!self || self.total == null || o.total == null) return "";
        const d = self.total - o.total;
        if (d > 0) return `<div class="same-cheaper">ถูกกว่า ${formatBaht(d)}</div>`;
        if (d < 0) return `<div class="order-line-meta">แพงกว่า ${formatBaht(-d)}</div>`;
        return `<div class="order-line-meta">ราคาเท่ากัน</div>`;
      };
      const feeCell = (o) =>
        `<td>${o.shipping_fee == null ? "—" : shippingFeeText({ fee: o.shipping_fee, free_reason: o.free_reason, free_over: o.free_over })}
           ${o.days_min ? `<div class="order-line-meta">${o.days_min}${o.days_max && o.days_max !== o.days_min ? `–${o.days_max}` : ""} วัน</div>` : ""}</td>`;
      box.innerHTML = `
        <div class="review-section">
          <h2 class="panel-title" style="margin-bottom: 4px;">ร้านอื่นที่ขายรุ่นนี้</h2>
          <p class="form-hint" style="margin: 0 0 10px;">
            สินค้ารหัสรุ่น/บาร์โค้ดเดียวกัน${province ? ` · ราคารวมค่าส่งไป${escapeHtml(province)}` : ""}</p>
          <div class="table-scroll">
            <table class="data-table">
              <thead><tr><th>ร้าน</th><th>ราคา</th>${province ? "<th>ค่าส่ง</th><th>รวม</th>" : ""}<th></th></tr></thead>
              <tbody>
                ${self
                  ? `<tr class="same-self">
                      <td><b>ร้านนี้</b><div class="order-line-meta">${escapeHtml(product.shop_name || "")}</div></td>
                      <td style="white-space: nowrap;">${formatBaht(product.price)}</td>
                      ${province ? `${feeCell(self)}<td style="white-space: nowrap;"><b>${self.total == null ? "—" : formatBaht(self.total)}</b></td>` : ""}
                      <td></td>
                    </tr>`
                  : ""}
                ${list
                  .map(
                    (o) => `
                  <tr>
                    <td><a href="shop.html?id=${o.shop_id}" class="cmp-link">${escapeHtml(o.shop_name || "")}</a>
                      ${o.shop_rating ? `<div class="order-line-meta">⭐ ${o.shop_rating}</div>` : ""}</td>
                    <td style="white-space: nowrap;"><a href="product-detail.html?id=${o.product_id}">${formatBaht(o.price)}</a></td>
                    ${province
                      ? `${feeCell(o)}
                         <td style="white-space: nowrap;"><b>${o.total == null ? "—" : formatBaht(o.total)}</b>${diffLabel(o)}</td>`
                      : ""}
                    <td style="white-space: nowrap;">${compareButtonHtml({ id: o.product_id, name: o.name || product.name, image: o.image || product.image, cover_url: o.cover_url, category_id: product.category_id })}</td>
                  </tr>`
                  )
                  .join("")}
              </tbody>
            </table>
          </div>
        </div>`;
    }

    async function loadReviews(productId, product) {
      const box = document.getElementById("review-content");
      let reviews = [];
      try {
        reviews = await fetchProductReviews(productId);
      } catch {
        return;
      }

      const list = reviews.length
        ? reviews
            .map(
              (r) => `
          <div class="review-item">
            <div class="review-head">
              <span class="review-author">${escapeHtml(r.user_name)}</span>
              <span class="review-stars">${starsHtml(r.rating)}</span>
              <span class="review-date">${formatDate(r.created_at)}</span>
            </div>
            <p class="review-comment">${escapeHtml(r.comment) || "(ไม่ได้เขียนข้อความ)"}</p>
          </div>`
            )
            .join("")
        : `<p class="state-message" style="padding: 30px 10px;">ยังไม่มีรีวิวสำหรับสินค้านี้ — เป็นคนแรกที่รีวิวได้เลยหลังจากสั่งซื้อและได้รับสินค้า</p>`;

      box.innerHTML = `
        <div class="review-section">
          <h2 class="panel-title" style="margin-bottom: 14px;">รีวิวจากผู้ซื้อจริง</h2>
          ${
            product.review_count > 0
              ? `<div class="rating-summary">
                   <span class="rating-score">${product.rating}</span>
                   <span class="review-stars" style="font-size:1.2rem">${starsHtml(product.rating)}</span>
                   <span style="color: var(--muted); font-size: var(--fs-sm);">จาก ${product.review_count} รีวิว</span>
                 </div>`
              : ""
          }
          ${list}
        </div>`;
    }

    // แชทรู้ว่ากำลังดูสินค้าชิ้นไหน (context_sku_id) — ไม่มีปุ่มลอย เข้าผ่านปุ่ม "ถามเกี่ยวกับสินค้านี้"
    ShopChat.init({ launcher: false, contextSkuId: getProductIdFromUrl() });
    loadDetail();
  </script>
</body>
</html>
