<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>รายละเอียดสินค้า - ShopMarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Taviraj:wght@400;500;600;700&family=Chakra+Petch:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="topbar">
    <a href="../index.html" class="logo">🛒 ShopMarket</a>
    <form class="search-bar" id="search-form">
      <input type="text" id="search-input" placeholder="ค้นหาสินค้า..." autocomplete="off" />
      <button type="submit">ค้นหา</button>
    </form>
    <span id="auth-status" data-base="../"></span>
    <a href="cart.html" class="cart-link">
      🛍️
      <span class="cart-badge" id="cart-badge">0</span>
    </a>
  </header>

  <main class="container">
    <a href="../index.html" class="back-link">← กลับไปหน้ารายการสินค้า</a>
    <div id="detail-content">
      <p class="state-message">กำลังโหลดข้อมูลสินค้า...</p>
    </div>
    <div id="review-content"></div>
  </main>

  <script src="../js/api.js"></script>
  <script>
    document.getElementById("search-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const q = document.getElementById("search-input").value.trim();
      window.location.href = q ? `../index.html?search=${encodeURIComponent(q)}` : "../index.html";
    });

    let currentProduct = null;
    let mediaList = [];

    function getProductIdFromUrl() {
      return parseInt(new URLSearchParams(window.location.search).get("id"), 10);
    }

    /** แสดงสื่อชิ้นที่เลือกในกรอบใหญ่ (รูปหรือวิดีโอ) */
    function selectMedia(index) {
      const main = document.getElementById("gallery-main");
      const item = mediaList[index];
      if (!item) return;

      main.innerHTML =
        item.media_type === "video"
          ? `<video src="${escapeHtml(item.url)}" controls playsinline></video>`
          : `<img src="${escapeHtml(item.url)}" alt="${escapeHtml(currentProduct.name)}" />`;

      document.querySelectorAll(".gallery-thumb").forEach((el, i) => {
        el.classList.toggle("active", i === index);
      });
    }

    function galleryHtml(product) {
      if (!mediaList.length) {
        // ยังไม่อัปโหลดสื่อ ใช้ emoji ตัวใหญ่แทน
        return `<div class="gallery-main">${product.image || "📦"}</div>`;
      }
      const thumbs = mediaList
        .map(
          (m, i) => `
          <button type="button" class="gallery-thumb ${i === 0 ? "active" : ""}" onclick="selectMedia(${i})">
            ${
              m.media_type === "video"
                ? `<video src="${escapeHtml(m.url)}" muted></video><span class="video-mark">▶</span>`
                : `<img src="${escapeHtml(m.url)}" alt="" />`
            }
          </button>`
        )
        .join("");
      return `
        <div>
          <div class="gallery-main" id="gallery-main"></div>
          ${mediaList.length > 1 ? `<div class="gallery-thumbs">${thumbs}</div>` : ""}
        </div>`;
    }

    async function loadDetail() {
      const container = document.getElementById("detail-content");
      const id = getProductIdFromUrl();

      if (!id) {
        container.innerHTML = `<p class="state-message">ไม่พบสินค้าที่ต้องการ (ไม่มี id ใน URL)</p>`;
        return;
      }

      let product;
      try {
        product = await fetchProduct(id);
      } catch (err) {
        container.innerHTML = `<p class="state-message">เกิดข้อผิดพลาด: ${escapeHtml(err.message)}</p>`;
        return;
      }
      if (!product) {
        container.innerHTML = `<p class="state-message">ไม่พบสินค้านี้ อาจถูกลบหรือปิดขายไปแล้ว</p>`;
        return;
      }

      currentProduct = product;
      mediaList = product.media || [];

      const outOfStock = product.stock === 0;
      const lowStock = product.stock > 0 && product.stock <= 5;

      container.innerHTML = `
        <div class="detail-layout">
          ${galleryHtml(product)}
          <div>
            <h1 class="detail-name">${escapeHtml(product.name)}</h1>
            <div class="detail-shop">
              ร้านค้า: <a href="shop.html?id=${product.shop_id}" style="color: var(--chili); font-weight: 600;">${escapeHtml(product.shop_name)}</a>
              · ${product.review_count > 0 ? `⭐ ${product.rating} (${product.review_count} รีวิว)` : "ยังไม่มีรีวิว"}
              · ขายแล้ว ${product.sold.toLocaleString("th-TH")} ชิ้น
            </div>
            <span class="pill-muted">${escapeHtml(product.category)}</span>
            ${product.free_shipping ? `<span class="badge-free-shipping" style="margin-left:8px">จัดส่งฟรี</span>` : ""}

            <div class="detail-price-box">
              <div class="detail-price">
                ${formatBaht(product.price)}
                ${product.original_price ? `<span class="original">${formatBaht(product.original_price)}</span>` : ""}
              </div>
            </div>

            <p class="detail-desc">${escapeHtml(product.description) || "ผู้ขายยังไม่ได้ใส่รายละเอียดสินค้า"}</p>

            ${
              outOfStock
                ? `<p class="stock-warning">สินค้าหมดชั่วคราว ไม่สามารถสั่งซื้อได้ในขณะนี้</p>
                   <button class="btn btn-secondary" disabled>สินค้าหมด</button>`
                : `
                  <div class="qty-selector">
                    <button type="button" id="qty-minus">−</button>
                    <input type="number" id="qty-input" value="1" min="1" max="${product.stock}" />
                    <button type="button" id="qty-plus">+</button>
                    <span style="color: var(--muted); font-size: 0.85rem;">คงเหลือ ${product.stock} ชิ้น</span>
                  </div>
                  ${lowStock ? `<p class="stock-warning">เหลือสินค้าจำนวนน้อย รีบสั่งซื้อก่อนหมด</p>` : ""}
                  <button class="btn btn-primary" id="add-to-cart-btn">เพิ่มลงตะกร้า</button>`
            }
          </div>
        </div>`;

      if (mediaList.length) selectMedia(0);

      if (!outOfStock) {
        const qtyInput = document.getElementById("qty-input");
        document.getElementById("qty-minus").addEventListener("click", () => {
          qtyInput.value = Math.max(1, parseInt(qtyInput.value || "1", 10) - 1);
        });
        document.getElementById("qty-plus").addEventListener("click", () => {
          qtyInput.value = Math.min(product.stock, parseInt(qtyInput.value || "1", 10) + 1);
        });
        document.getElementById("add-to-cart-btn").addEventListener("click", async (e) => {
          const btn = e.currentTarget;
          const qty = Math.max(1, Math.min(product.stock, parseInt(qtyInput.value || "1", 10)));
          btn.disabled = true;
          try {
            await addToCart(product.id, qty);
            await renderCartBadge();
            showToast("เพิ่มลงตะกร้าแล้ว ✓");
          } catch (err) {
            showToast(err.message, "error");
          } finally {
            btn.disabled = false;
          }
        });
      }

      loadReviews(id, product);
    }

    async function loadReviews(productId, product) {
      const box = document.getElementById("review-content");
      let reviews = [];
      try {
        reviews = await fetchProductReviews(productId);
      } catch {
        return;
      }

      const list = reviews.length
        ? reviews
            .map(
              (r) => `
          <div class="review-item">
            <div class="review-head">
              <span class="review-author">${escapeHtml(r.user_name)}</span>
              <span class="review-stars">${starsHtml(r.rating)}</span>
              <span class="review-date">${formatDate(r.created_at)}</span>
            </div>
            <p class="review-comment">${escapeHtml(r.comment) || "(ไม่ได้เขียนข้อความ)"}</p>
          </div>`
            )
            .join("")
        : `<p class="state-message" style="padding: 30px 10px;">ยังไม่มีรีวิวสำหรับสินค้านี้ — เป็นคนแรกที่รีวิวได้เลยหลังจากสั่งซื้อและได้รับสินค้า</p>`;

      box.innerHTML = `
        <div class="review-section">
          <h2 class="panel-title" style="margin-bottom: 14px;">รีวิวจากผู้ซื้อจริง</h2>
          ${
            product.review_count > 0
              ? `<div class="rating-summary">
                   <span class="rating-score">${product.rating}</span>
                   <span class="review-stars" style="font-size:1.2rem">${starsHtml(product.rating)}</span>
                   <span style="color: var(--muted); font-size: 0.88rem;">จาก ${product.review_count} รีวิว</span>
                 </div>`
              : ""
          }
          ${list}
        </div>`;
    }

    loadDetail();
  </script>
</body>
</html>
