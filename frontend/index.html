<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopMarket - ตลาดนัดออนไลน์ ซื้อง่าย ขายคล่อง</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Taviraj:wght@400;500;600;700&family=Chakra+Petch:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css?v=20261016a" />
</head>
<body>
  <a href="#main" class="skip-link">ข้ามไปเนื้อหาหลัก</a>
  <header class="topbar">
    <a href="index.html" class="logo">🛒 ShopMarket</a>
    <form class="search-bar" id="search-form">
      <input type="search" id="search-input" aria-label="ค้นหาสินค้า" placeholder="พิมพ์ชื่อสินค้า เช่น หูฟัง ร่ม หม้อหุงข้าว" autocomplete="off" />
      <button type="submit">ค้นหา</button>
    </form>
    <span id="auth-status" data-base=""></span>
    <a href="pages/cart.html" class="cart-link" aria-label="ตะกร้าสินค้า">
      <span aria-hidden="true">🛍️</span>
      <span class="icon-label">ตะกร้า</span>
      <span class="cart-badge" id="cart-badge">0</span>
    </a>
  </header>

  <section class="hero">
    <div class="hero-blob"></div>
    <div class="hero-inner">
      <span class="hero-kicker">ตลาดนัดออนไลน์ • เปิดทุกวัน 24 ชม.</span>
      <h1 class="hero-title">ของมันต้องมี<br />ราคามันต้องคุ้ม</h1>
      <p class="hero-sub">ซื้อของจากร้านค้าที่คัดสรรแล้ว หรือเปิดร้านขายของคุณเองได้ฟรี ไม่มีค่าธรรมเนียม</p>
    </div>
  </section>

  <main class="container" id="main" tabindex="-1">
    <div class="category-bar" id="category-bar"></div>

    <details class="filter-details" id="filter-details">
      <summary class="filter-summary">🔍 ตัวกรองราคาและการเรียง</summary>
    <form class="filter-bar" id="filter-form">
      <label for="min-price">ราคา</label>
      <input type="number" id="min-price" placeholder="ต่ำสุด" min="0" aria-label="ราคาต่ำสุด (บาท)" inputmode="numeric" />
      <span style="color: var(--muted)">–</span>
      <input type="number" id="max-price" placeholder="สูงสุด" min="0" aria-label="ราคาสูงสุด (บาท)" inputmode="numeric" />

      <label for="sort-select" style="margin-left: 8px">เรียงตาม</label>
      <select id="sort-select">
        <option value="latest">ล่าสุด</option>
        <option value="popular">ขายดี</option>
        <option value="rating">คะแนนรีวิว</option>
        <option value="price_asc">ราคาต่ำ → สูง</option>
        <option value="price_desc">ราคาสูง → ต่ำ</option>
      </select>

      <button type="submit" class="btn btn-primary btn-sm">ค้นหาตามนี้</button>
      <button type="button" class="btn-ghost" id="reset-filter">ล้างตัวกรอง</button>
    </form>
    </details>

    <p class="page-title" id="page-title">สินค้าแนะนำสำหรับคุณ</p>
    <p class="search-note" id="search-note" hidden>รวมสินค้าที่ใกล้เคียงกับที่ค้นหาไว้ด้วย</p>
    <div class="product-grid" id="product-grid">
      <p class="state-message">กำลังโหลดสินค้า...</p>
    </div>
  </main>

  <script src="js/api.js?v=20261016a"></script>
  <script src="js/chat.js?v=20261016a"></script>
  <script>
    const grid = document.getElementById("product-grid");
    const pageTitle = document.getElementById("page-title");
    const searchInput = document.getElementById("search-input");
    const searchForm = document.getElementById("search-form");
    const categoryBar = document.getElementById("category-bar");
    const filterForm = document.getElementById("filter-form");

    /** อ่านเงื่อนไขค้นหาทั้งหมดจาก URL — ทำให้กด back/แชร์ลิงก์แล้วผลลัพธ์เหมือนเดิม */
    function readParams() {
      const p = new URLSearchParams(window.location.search);
      return {
        search: p.get("search") || "",
        category_id: p.get("category_id") || "",
        min_price: p.get("min_price") || "",
        max_price: p.get("max_price") || "",
        sort: p.get("sort") || "latest",
      };
    }

    function applyParams(next) {
      const params = { ...readParams(), ...next };
      const query = new URLSearchParams();
      Object.entries(params).forEach(([k, v]) => {
        if (v && !(k === "sort" && v === "latest")) query.set(k, v);
      });
      const qs = query.toString();
      window.location.href = `index.html${qs ? `?${qs}` : ""}`;
    }

    async function renderCategories(activeId) {
      let categories = [];
      try {
        categories = await fetchCategories();
      } catch {
        return;
      }
      const chips = [
        `<button type="button" class="category-chip ${!activeId ? "active" : ""}"
            onclick="applyParams({ category_id: '' })">🏷️ ทั้งหมด</button>`,
        ...categories.map(
          (c) => `
          <button type="button" class="category-chip ${
            String(c.id) === String(activeId) ? "active" : ""
          }" onclick="applyParams({ category_id: '${c.id}' })">
            ${c.icon} ${escapeHtml(c.name)}
          </button>`
        ),
      ];
      categoryBar.innerHTML = chips.join("");
    }

    function renderProducts(products) {
      // backend บอกว่ามีสินค้าที่ "ใกล้เคียง" (ค้นจากความหมาย) ปนมาด้วย → แจ้งสั้นๆ ไม่ต้องอธิบายวิธี
      document.getElementById("search-note").hidden = !products.some((p) => p.match === "semantic");
      // หน้าไม่พบสินค้ามีปุ่มแชทของตัวเองอยู่แล้ว → ซ่อนปุ่มลอยไม่ให้ทับกัน
      document.body.classList.toggle("empty-results", products.length === 0);
      if (products.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon" aria-hidden="true">🔍</div>
            <p>ไม่พบสินค้าที่ตรงกับที่ค้นหา</p>
            <p class="form-hint">ลองใช้คำอื่น เช่น "หูฟัง" "ร่ม" หรือ "หม้อ" หรือกด "ล้างตัวกรอง"</p>
            ${window.ShopChat?.isReady()
              ? `<button type="button" class="btn btn-primary" onclick="ShopChat.open()">💬 ให้ผู้ช่วยช่วยหา</button>`
              : `<a href="index.html" class="btn btn-primary">ดูสินค้าทั้งหมด</a>`}
          </div>`;
        return;
      }
      grid.innerHTML = products
        .map((p, i) => {
          const outOfStock = p.stock === 0;
          return `
          <div class="product-card" style="--i:${i}" onclick="location.href='pages/product-detail.html?id=${p.id}'">
            <div class="product-thumb-wrap">
              <div class="product-thumb">${productThumb(p)}</div>
              ${outOfStock ? `<div class="badge-out-of-stock">สินค้าหมด</div>` : ""}
            </div>
            <div class="product-info">
              ${p.free_shipping ? `<span class="badge-free-shipping">ส่งฟรี</span>` : ""}
              ${specCompleteBadge(p)}
              <a class="product-name" href="pages/product-detail.html?id=${p.id}" onclick="event.stopPropagation()">${escapeHtml(p.name)}</a>
              <div class="product-price">
                ${priceHtml(p)}
              </div>
              <div class="product-meta">
                <span>${p.review_count > 0 ? `⭐ ${p.rating}` : "ยังไม่มีรีวิว"}</span>
                <span>ขายแล้ว ${p.sold.toLocaleString("th-TH")}</span>
              </div>
            </div>
          </div>`;
        })
        .join("");
    }

    async function loadProducts() {
      const params = readParams();
      searchInput.value = params.search;
      document.getElementById("min-price").value = params.min_price;
      document.getElementById("max-price").value = params.max_price;
      document.getElementById("sort-select").value = params.sort;

      pageTitle.textContent = params.search
        ? `ผลการค้นหา "${params.search}"`
        : "สินค้าแนะนำสำหรับคุณ";

      renderCategories(params.category_id);

      try {
        renderProducts(await fetchProducts(params));
      } catch (err) {
        grid.innerHTML = `<p class="state-message">เกิดข้อผิดพลาด: ${escapeHtml(err.message)}</p>`;
      }
    }

    searchForm.addEventListener("submit", (e) => {
      e.preventDefault();
      applyParams({ search: searchInput.value.trim() });
    });

    filterForm.addEventListener("submit", (e) => {
      e.preventDefault();
      applyParams({
        min_price: document.getElementById("min-price").value,
        max_price: document.getElementById("max-price").value,
        sort: document.getElementById("sort-select").value,
      });
    });

    document.getElementById("reset-filter").addEventListener("click", () => {
      window.location.href = "index.html";
    });

    // จอใหญ่: เปิดตัวกรองไว้เลย; มือถือ: ย่อไว้ สินค้าจะได้ขึ้นจอแรก (เปิดไว้ถ้ามีการกรองอยู่)
    {
      const p = new URLSearchParams(window.location.search);
      const filtering = ["min_price", "max_price", "sort"].some((k) => p.get(k));
      document.getElementById("filter-details").open = window.innerWidth > 700 || filtering;
    }
    // ตัวอย่างคำค้นแบบ "ของขวัญให้แม่" ใช้ได้เฉพาะเมื่อระบบค้นจากความหมายเปิดอยู่ ไม่งั้นผู้ใช้จะเจอทางตัน
    fetchFeatures().then((f) => {
      document.getElementById("search-input").placeholder = f && f.semantic_search
        ? "พิมพ์สิ่งที่อยากได้ เช่น หูฟัง หรือ ของขวัญให้แม่"
        : "พิมพ์ชื่อสินค้า เช่น หูฟัง ร่ม หม้อหุงข้าว";
    });
    loadProducts();
    ShopChat.init({ launcher: true });
  </script>
</body>
</html>
